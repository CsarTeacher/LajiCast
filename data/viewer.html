<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LajiCast · Televisión escolar</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, Arial, sans-serif; background:#10151c; color:#eef3f7; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
    main { width:min(100%, 960px); }
    header { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
    header img { width:52px; height:52px; object-fit:contain; }
    h1 { font-size:1.5rem; margin:0; } p { color:#b8c6d2; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
    input, button { font:inherit; padding:11px 14px; border-radius:9px; border:1px solid #40505f; }
    input { background:#1a232d; color:inherit; flex:1; min-width:180px; }
    button { color:white; background:#1767b1; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    video { width:100%; background:#050709; border-radius:12px; aspect-ratio:16/9; }
    #status { min-height:1.5em; }
  </style>
</head>
<body>
  <main>
    <header><img src="/branding/lajicast.png" alt=""><h1>LajiCast · Televisión escolar</h1></header>
    <p>Escribe el nombre de tu aula y pulsa «Conectar».</p>
    <div class="controls">
      <input id="classroom" maxlength="48" autocomplete="organization" placeholder="Ejemplo: Aula 5ºA">
      <button id="connect">Conectar</button>
      <button id="sound" disabled>Activar sonido</button>
    </div>
    <video id="video" autoplay playsinline controls></video>
    <p id="status" role="status">Esperando conexión.</p>
  </main>
  <script>
    const classroomInput = document.querySelector('#classroom');
    const connectButton = document.querySelector('#connect');
    const soundButton = document.querySelector('#sound');
    const video = document.querySelector('#video');
    const status = document.querySelector('#status');
    const params = new URLSearchParams(location.search);
    classroomInput.value = params.get('classroom') || '';
    let pc = null;
    let resourceUrl = '';
    let userStopped = false;
    let retryCount = 0;
    let retryTimer = 0;

    function endpoint() {
      const url = new URL('/lajicast/whep', location.href);
      url.port = '8889';
      url.searchParams.set('classroom', classroomInput.value.trim() || 'Aula sin nombre');
      return url;
    }

    function waitForIceGathering(peer) {
      if (peer.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise(resolve => {
        const timeout = setTimeout(resolve, 5000);
        peer.addEventListener('icegatheringstatechange', () => {
          if (peer.iceGatheringState === 'complete') { clearTimeout(timeout); resolve(); }
        });
      });
    }

    async function closePeer() {
      const previousPeer = pc;
      const previousResource = resourceUrl;
      pc = null;
      resourceUrl = '';
      if (previousPeer) previousPeer.close();
      video.srcObject = null;
      if (previousResource) {
        try { await fetch(previousResource, { method: 'DELETE' }); } catch (_) {}
      }
    }

    async function connect() {
      clearTimeout(retryTimer);
      userStopped = false;
      connectButton.disabled = true;
      classroomInput.disabled = true;
      soundButton.disabled = false;
      status.textContent = retryCount ? 'Recuperando la señal…' : 'Conectando con el centro…';
      await closePeer();
      const peer = new RTCPeerConnection({ iceServers: [] });
      pc = peer;
      peer.addTransceiver('video', { direction: 'recvonly' });
      peer.addTransceiver('audio', { direction: 'recvonly' });
      peer.ontrack = event => { video.srcObject = event.streams[0]; video.play().catch(() => {}); };
      peer.onconnectionstatechange = () => {
        if (pc !== peer) return;
        if (peer.connectionState === 'connected') {
          retryCount = 0;
          status.textContent = `Conectado · ${classroomInput.value.trim() || 'Aula sin nombre'}`;
        } else if (['failed', 'disconnected', 'closed'].includes(peer.connectionState) && !userStopped) {
          scheduleReconnect();
        }
      };
      try {
        await peer.setLocalDescription(await peer.createOffer());
        await waitForIceGathering(peer);
        const response = await fetch(endpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: peer.localDescription.sdp
        });
        if (!response.ok) throw new Error(`El centro respondió ${response.status}`);
        const locationHeader = response.headers.get('Location');
        resourceUrl = locationHeader ? new URL(locationHeader, endpoint()).href : '';
        await peer.setRemoteDescription({ type: 'answer', sdp: await response.text() });
        status.textContent = 'Esperando vídeo y sonido…';
      } catch (error) {
        status.textContent = `No se pudo conectar: ${error.message}`;
        scheduleReconnect();
      }
    }

    function scheduleReconnect() {
      if (userStopped) return;
      if (pc) pc.close();
      pc = null;
      retryCount++;
      const delay = Math.min(10000, 1000 * Math.pow(2, Math.min(retryCount - 1, 3)));
      status.textContent = `Señal interrumpida. Reintentando en ${Math.ceil(delay / 1000)} s…`;
      retryTimer = setTimeout(connect, delay);
    }

    connectButton.addEventListener('click', () => { retryCount = 0; connect(); });
    soundButton.addEventListener('click', () => {
      video.muted = false;
      video.volume = 1;
      video.play().catch(() => {});
      soundButton.textContent = 'Sonido activado';
    });
    window.addEventListener('beforeunload', () => { userStopped = true; clearTimeout(retryTimer); if (pc) pc.close(); });
  </script>
</body>
</html>
